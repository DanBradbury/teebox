<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driving Range</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --panel: rgba(12,20,16,.72); --line: rgba(255,255,255,.14); --fg: #eef5ee; --dim: #9fb3a3; --accent: #7fe08a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1a12; color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); padding: 12px 14px; }
  #top { top: 12px; left: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 250px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c0453f; box-shadow: 0 0 8px currentColor; }
  .dot.wait { background: #e0b341; } .dot.ok { background: #46d06a; }
  select, button, #targetDistance { font: inherit; font-size: 14px; color: var(--fg); background: rgba(255,255,255,.08);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
  #targetDistance { width: 72px; user-select: text; }
  button:hover, select:hover { background: rgba(255,255,255,.16); }
  button.primary { background: #2f8f48; border-color: #3fbf63; font-weight: 600; }
  button.primary:hover { background: #38a655; }
  #data { top: 12px; right: 12px; width: 230px; }
  #data h3, #hist h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-size: 14px; }
  .grid span:nth-child(odd) { color: var(--dim); }
  .grid span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  #result { position: fixed; top: 14%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none;
    text-shadow: 0 2px 12px rgba(0,0,0,.7); opacity: 0; transition: opacity .25s; }
  #result.show { opacity: 1; }
  #result .big { font-size: 54px; font-weight: 700; letter-spacing: .02em; }
  #result .big small { font-size: 22px; font-weight: 500; color: #d7e8d9; }
  #result .sub { font-size: 20px; color: #e6f1e7; margin-top: 2px; }
  #hist { bottom: 12px; left: 12px; width: 470px; max-height: 38vh; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: right; color: var(--dim); font-weight: 600; padding: 2px 6px; position: sticky; top: 0; background: #101a14; }
  td { text-align: right; padding: 3px 6px; border-top: 1px solid rgba(255,255,255,.06); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  tr.last td { color: var(--accent); }
  #mini { bottom: 12px; right: 12px; padding: 8px; }
  #mini canvas { display: block; }
  #mini .cap { font-size: 11px; color: var(--dim); text-align: center; margin-top: 4px; letter-spacing: .08em; text-transform: uppercase; }
  #profile { top: 78px; right: 12px; padding: 9px; width: 230px; }
  #profile[hidden] { display: none; }
  #profile canvas { display: block; width: 210px; height: 105px; }
  .hint { font-size: 12px; color: var(--dim); }
  kbd { background: rgba(255,255,255,.12); border-radius: 4px; padding: 1px 6px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--dim); }
  .cond { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--dim); }
  .cond input, .cond select { width: 100%; font: inherit; font-size: 13px; color: var(--fg); background: rgba(255,255,255,.08);
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; user-select: text; }
  .cond option, #top select option { color: #111; }
  #courseControls { display: flex; flex-direction: column; gap: 8px; }
  #courseControls[hidden], #rangeControls[hidden] { display: none; }
  #courseNote { max-width: 240px; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="top">
  <div class="badge"><span class="dot" id="srvDot"></span><span id="srvTxt">Connecting to app…</span></div>
  <div class="badge"><span class="dot" id="lmDot"></span><span id="lmTxt">Launch monitor: not connected</span></div>
  <div class="row">
    <label class="badge" for="club">Club</label>
    <select id="club"></select>
    <select id="speed" title="Playback speed"><option value="1">1×</option><option value="2">2×</option><option value="0.5">0.5×</option></select>
  </div>
  <div class="row"><label class="badge" for="sceneMode">Scene</label><select id="sceneMode"><option value="range">Driving range</option><option value="course">Course hole</option></select></div>
  <div class="row" id="rangeControls">
    <label class="badge" for="targetDistance">Pin distance</label>
    <input id="targetDistance" type="number" min="25" max="400" step="1" value="150" aria-label="Pin distance in yards">
    <span class="badge">yd</span>
  </div>
  <div id="courseControls" hidden>
    <div class="row"><label class="badge" for="courseSelect">Course</label><select id="courseSelect"></select></div>
    <div class="row"><label class="badge" for="holeSelect">Hole</label><select id="holeSelect"></select><span class="badge" id="holeInfo"></span></div>
    <div class="hint" id="courseNote">Loading course data…</div>
  </div>
  <div class="row">
    <button class="primary" id="simBtn">Simulate shot</button>
    <button id="csvBtn">Export CSV</button>
    <button id="clearBtn">Clear</button>
  </div>
  <details id="condBox">
    <summary>Conditions <span id="condSum"></span></summary>
    <div class="cond">
      <label for="cTemp">Temperature °F</label><input id="cTemp" type="number" min="-20" max="130" step="1">
      <label for="cAlt">Altitude ft</label><input id="cAlt" type="number" min="-1000" max="15000" step="100">
      <label for="cHum">Humidity %</label><input id="cHum" type="number" min="0" max="100" step="5">
      <label for="cWind">Wind mph</label><input id="cWind" type="number" min="0" max="60" step="1">
      <label for="cFrom">Wind</label><select id="cFrom">
        <option value="0">Into (headwind)</option><option value="45">Into, from right</option><option value="90">From right</option>
        <option value="135">Helping, from right</option><option value="180">Helping (tailwind)</option><option value="225">Helping, from left</option>
        <option value="270">From left</option><option value="315">Into, from left</option></select>
      <label for="cTurf">Turf</label><select id="cTurf"></select>
    </div>
  </details>
  <div class="hint"><kbd>Space</kbd> = simulated shot · real shots arrive automatically</div>
</div>

<div class="panel" id="data">
  <h3>Last shot</h3>
  <div class="grid" id="dataGrid"></div>
</div>

<div id="result"><div class="big" id="resBig"></div><div class="sub" id="resSub"></div></div>

<div class="panel" id="hist">
  <h3>Session</h3>
  <table>
    <thead><tr><th>#</th><th>Club</th><th>Ball</th><th>Carry</th><th>Total</th><th>Offline</th><th>Apex</th></tr></thead>
    <tbody id="histBody"></tbody>
  </table>
</div>

<div class="panel" id="mini"><canvas id="mapc" width="190" height="270"></canvas><div class="cap">Dispersion (yd)</div></div>
<div class="panel" id="profile" hidden><div class="hint">HEIGHT VS TEE · TEE → GREEN</div><canvas id="profilec" width="210" height="105"></canvas></div>

<script src="physics.js"></script>
<script src="course.js"></script>
<script>
const P = GolfPhysics, YD = P.YD;
const $ = (s) => document.querySelector(s);
const cv = $('#view'), ctx = cv.getContext('2d');
const mapc = $('#mapc'), mctx = mapc.getContext('2d');
let W, H, focal;

// ---------- small vector helpers ----------
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = (a) => { const l = Math.hypot(...a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (x, d = 0) => (Number.isFinite(x) ? x.toFixed(d) : '–');

function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  focal = H * 1.0;
}
addEventListener('resize', resize); resize();

// ---------- camera ----------
const HOME = { pos: [0, 2.6, -9], tgt: [0, -2, 100] };
const cam = { pos: HOME.pos.slice(), tgt: HOME.tgt.slice() };
let B;
function updateBasis() { const f = norm(sub(cam.tgt, cam.pos)); const r = norm(cross([0,1,0], f)); B = { f, r, u: cross(f, r) }; }
const toCam = (p) => { const d = sub(p, cam.pos); return [dot(d, B.r), dot(d, B.u), dot(d, B.f)]; };
const scr = (c) => [W/2 + focal * c[0] / c[2], H/2 - focal * c[1] / c[2]];
const NEAR = 0.3;
function project(p) { const c = toCam(p); return c[2] < NEAR ? null : { x: W/2 + focal*c[0]/c[2], y: H/2 - focal*c[1]/c[2], z: c[2] }; }
function polyScr(pts) {
  const cs = pts.map(toCam), out = [];
  for (let i = 0; i < cs.length; i++) {
    const a = cs[i], b = cs[(i+1) % cs.length], ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t), NEAR]); }
  }
  return out.map(scr);
}
function fillPoly(pts, style, stroke) {
  const s = polyScr(pts); if (s.length < 3) return;
  ctx.beginPath(); s.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
  ctx.fillStyle = style; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
// ---------- scene ----------
const DEFAULT_TARGET_YD = 150;
let targetYd = DEFAULT_TARGET_YD;
try {
  const saved = Number(localStorage.getItem('teebox.targetYd'));
  if (Number.isFinite(saved) && saved >= 25 && saved <= 400) targetYd = Math.round(saved);
} catch (e) { /* storage unavailable */ }
$('#targetDistance').value = targetYd;
$('#targetDistance').onchange = (e) => {
  const value = Number(e.target.value);
  targetYd = Number.isFinite(value) && e.target.value !== '' ? Math.round(Math.max(25, Math.min(400, value))) : DEFAULT_TARGET_YD;
  e.target.value = targetYd;
  try { localStorage.setItem('teebox.targetYd', String(targetYd)); } catch (err) { /* storage unavailable */ }
};
let sceneMode = 'range', course = null, hole = null;
let anim = null;          // { res, t0, shot, carryShown, endShown, endedAt }
const markers = [];       // landing markers { x, z, color }
// On a course hole the next shot is played from where the last one stopped, aimed at the flag.
let lie = null;           // { x, z } resting ball in hole metres; null = on the tee
let onGreen = false;      // last shot reached the green, so play restarts from the tee
const GREEN_RADIUS = 12;
// Origin and aim (unit vector) of the next shot. Shot-local x is right of aim, z along it.
function shotFrame() {
  if (sceneMode !== 'course' || !hole || !lie) return { x: 0, z: 0, fx: 0, fz: 1 };
  const dx = hole.green.x - lie.x, dz = hole.green.z - lie.z, d = Math.hypot(dx, dz) || 1;
  return { x: lie.x, z: lie.z, fx: dx / d, fz: dz / d };
}
const frameWorld = (fr, [x, y, z]) => [fr.x + x * fr.fz + z * fr.fx, y, fr.z - x * fr.fx + z * fr.fz];
const frameLocal = (fr, [x, y, z]) => [(x - fr.x) * fr.fz - (z - fr.z) * fr.fx, y, (x - fr.x) * fr.fx + (z - fr.z) * fr.fz];
function showHoleInfo() {
  const toPin = lie && Math.hypot(hole.green.x - lie.x, hole.green.z - lie.z) / YD;
  $('#holeInfo').textContent = !hole ? '' : `Par ${hole.par} · ${hole.distance} yd` +
    (lie ? ` · ${fmt(toPin)} yd to pin` : onGreen ? ' · on the green, back to the tee' : '');
}
// Move play to the resting place of the shot being shown.
function settleShot() {
  if (!anim || sceneMode !== 'course' || !hole) return;
  const rest = anim.res.path[anim.res.path.length - 1];
  onGreen = Math.hypot(hole.green.x - rest[1], hole.green.z - rest[3]) <= GREEN_RADIUS;
  lie = onGreen ? null : { x: rest[1], z: rest[3] };
  showHoleInfo();
}
function clearSceneShots() {
  markers.length = 0; anim = null; lie = null; onGreen = false;
  showHoleInfo();
  $('#result').classList.remove('show');
}
function selectHole(number) {
  const raw = course?.holes.find((item) => item.number === number);
  hole = raw ? CourseGeometry.holeWorld(raw, course.elevation) : null;
  if (hole?.elevationSource) hole.terrain = buildTerrain(hole);
  $('#courseNote').textContent = hole?.elevationSource
    ? `USGS terrain · green ${hole.greenRise >= 0 ? '+' : ''}${fmt(hole.greenRise * 3.28084, 1)} ft from tee · fairway width estimated${
      course.horizon ? ` · real skyline${course.horizon.scale > 1.05 ? ` ×${fmt(course.horizon.scale, 1)} height` : ''}` : ''}`
    : hole ? 'No elevation imported · fairway and trees estimated from centerline.' : 'No hole selected';
  $('#profile').hidden = sceneMode !== 'course' || !hole?.elevationSource;
  if (hole?.elevationSource) drawElevationProfile(hole);
  clearSceneShots();
  try { localStorage.setItem('teebox.hole', String(number)); } catch (e) { /* storage unavailable */ }
}
async function selectCourse(handle) {
  try {
    const response = await fetch(`/courses/${encodeURIComponent(handle)}.json`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    course = await response.json();
    if (course.horizon) course.horizon.scale = horizonScale(course.horizon);
    $('#holeSelect').replaceChildren(...course.holes.map((item) => new Option(`Hole ${item.number}`, item.number)));
    let saved = NaN;
    try { saved = Number(localStorage.getItem('teebox.hole')); } catch (e) { /* storage unavailable */ }
    if (!course.holes.some((item) => item.number === saved)) saved = course.holes[0].number;
    $('#holeSelect').value = String(saved);
    selectHole(saved);
    try { localStorage.setItem('teebox.course', handle); } catch (e) { /* storage unavailable */ }
  } catch (error) {
    course = hole = lie = null;
    $('#holeInfo').textContent = '';
    $('#profile').hidden = true;
    $('#courseNote').textContent = `Course unavailable: ${error.message}`;
  }
}
$('#sceneMode').onchange = (event) => {
  sceneMode = event.target.value;
  $('#rangeControls').hidden = sceneMode !== 'range';
  $('#courseControls').hidden = sceneMode !== 'course';
  $('#profile').hidden = sceneMode !== 'course' || !hole?.elevationSource;
  clearSceneShots();
  try { localStorage.setItem('teebox.sceneMode', sceneMode); } catch (e) { /* storage unavailable */ }
};
$('#courseSelect').onchange = (event) => selectCourse(event.target.value);
$('#holeSelect').onchange = (event) => selectHole(Number(event.target.value));
fetch('/courses/index.json').then((response) => {
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}).then((catalog) => {
  $('#courseSelect').replaceChildren(...catalog.map((item) => new Option(item.name, item.handle)));
  if (!catalog.length) { $('#courseNote').textContent = 'No courses imported'; return; }
  let saved = null;
  try { saved = localStorage.getItem('teebox.course'); } catch (e) { /* storage unavailable */ }
  const handle = catalog.some((item) => item.handle === saved) ? saved : catalog[0].handle;
  $('#courseSelect').value = handle;
  return selectCourse(handle);
}).catch((error) => { $('#courseNote').textContent = `Course catalog unavailable: ${error.message}`; });
try {
  if (localStorage.getItem('teebox.sceneMode') === 'course') {
    $('#sceneMode').value = 'course';
    $('#sceneMode').onchange({ target: $('#sceneMode') });
  }
} catch (e) { /* storage unavailable */ }
// Fixed landscape detail keeps the scenery stable while the camera follows a shot.
const noise = (n) => { const x = Math.sin(n * 127.1 + 78.23) * 43758.5453; return x - Math.floor(x); };
const trees = [];
for (let i = 0; i < 58; i++) {
  const z = 35 + i * 8.2;
  for (const side of [-1, 1]) {
    trees.push({ x: side * (59 + noise(i * 17 + side) * 35), z: z + noise(i * 11 + side) * 7,
      h: 8 + noise(i * 29 + side) * 8, shade: noise(i * 37 + side) });
  }
}
trees.sort((a, b) => b.z - a.z);
const grass = Array.from({ length: 520 }, (_, i) => ({
  x: (noise(i * 19 + 3) - .5) * 94,
  z: 4 + noise(i * 23 + 7) * 165,
  height: .07 + noise(i * 31 + 9) * .18,
  light: noise(i * 41 + 11) > .5
}));

function drawMountains(hy) {
  // Three ridges with wide valley opening behind the range.
  const layers = [
    { base: '#a4b8ba', peak: .18, shift: 1.4, detail: .016 },
    { base: '#718d88', peak: .22, shift: 5.7, detail: .022 },
    { base: '#466d62', peak: .16, shift: 9.8, detail: .017 }
  ];
  layers.forEach((layer, li) => {
    const points = [];
    const steps = Math.max(48, Math.ceil(W / 18));
    for (let i = 0; i <= steps; i++) {
      const u = i / steps, side = Math.abs(u - .5) * 2;
      const valley = .38 + .62 * Math.pow(side, 1.3);
      const folds = Math.sin(u * 18 + layer.shift) * .22 + Math.sin(u * 43 + layer.shift * 1.7) * .10;
      const crags = (noise(i * .73 + li * 91) - .5) * layer.detail * H;
      points.push([u * W, hy - H * layer.peak * (valley + folds) + crags]);
    }
    const grad = ctx.createLinearGradient(0, hy - H * layer.peak, 0, hy + 25);
    grad.addColorStop(0, layer.base);
    grad.addColorStop(1, ['#c2d0c9', '#91aaa0', '#527e63'][li]);
    ctx.beginPath(); ctx.moveTo(0, hy + 30);
    points.forEach(([x, y]) => ctx.lineTo(x, y));
    ctx.lineTo(W, hy + 30); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
    if (li === 0) {
      // Pale rock faces catch light on distant peaks.
      ctx.strokeStyle = 'rgba(235,238,228,.42)'; ctx.lineWidth = 1.5;
      for (let i = 5; i < points.length - 5; i += 7) {
        const [x, y] = points[i];
        ctx.beginPath(); ctx.moveTo(x - 8, y + 2); ctx.lineTo(x, y + 12 + noise(i) * 18);
        ctx.lineTo(x + 7, y + 23 + noise(i + 3) * 18); ctx.stroke();
      }
    }
  });
}

// Real skyline baked by scripts/import-horizon.js, rotated to the hole's compass bearing.
// Low relief is exaggerated (up to 6×) so distant ranges stay readable; steep terrain is drawn 1:1.
function horizonScale(horizon) {
  const peak = Math.max(...horizon.bands.flatMap((band) => band.angles));
  return Math.max(1, Math.min(6, 5 / Math.max(peak, .01)));
}
function drawHorizon(hy) {
  const horizon = course.horizon, DEG = 180 / Math.PI;
  const heading = hole.bearing + Math.atan2(B.f[0], B.f[2]) * DEG;
  const ridge = (angleAt) => {
    ctx.beginPath(); ctx.moveTo(0, hy + 30);
    for (let x = 0; x <= W + 6; x += 6) {
      const a = Math.atan((x - W / 2) / focal);
      ctx.lineTo(x, hy - focal * Math.tan(angleAt(heading + a * DEG) / DEG) / Math.cos(a));
    }
    ctx.lineTo(W, hy + 30); ctx.closePath();
  };
  const colors = [['#466d62', '#527e63'], ['#718d88', '#91aaa0'], ['#a4b8ba', '#c2d0c9']];
  for (let b = horizon.bands.length - 1; b >= 0; b--) {
    const band = horizon.bands[b], [base, foot] = colors[Math.min(b, colors.length - 1)];
    const top = hy - focal * Math.tan(Math.max(...band.angles) * horizon.scale / DEG);
    const grad = ctx.createLinearGradient(0, top, 0, hy + 25);
    grad.addColorStop(0, base); grad.addColorStop(1, foot);
    ridge((azimuth) => CourseGeometry.horizonAngle(horizon, band, azimuth) * horizon.scale);
    ctx.fillStyle = grad; ctx.fill();
  }
  // Distant tree line is a visual estimate; it is keyed to azimuth so it stays put as the camera pans.
  ridge((azimuth) => {
    const at = azimuth * 3, i = Math.floor(at), t = at - i;
    return .35 + lerp(noise(i), noise(i + 1), t) * .5;
  });
  ctx.fillStyle = '#3c6647'; ctx.fill();
}

function drawTree(tree) {
  const base = tree.y || 0;
  const foot = project([tree.x, base, tree.z]);
  const top = project([tree.x, base + tree.h, tree.z]);
  if (!foot || !top) return;
  const h = foot.y - top.y, w = h * .38;
  if (h < 2 || foot.x < -w || foot.x > W + w) return;
  ctx.fillStyle = 'rgba(21,50,27,.16)';
  ctx.beginPath(); ctx.ellipse(foot.x + w * .5, foot.y, w * 1.25, Math.max(1, w * .17), 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(25,43,34,.55)';
  ctx.fillRect(foot.x - Math.max(1, w * .08), foot.y - h * .34, Math.max(2, w * .16), h * .35);
  const shade = tree.shade;
  ctx.fillStyle = shade < .33 ? '#284e3a' : shade < .67 ? '#315a40' : '#3c6847';
  ctx.beginPath();
  ctx.moveTo(foot.x, top.y);
  ctx.lineTo(foot.x + w * .56, top.y + h * .34);
  ctx.lineTo(foot.x + w * .38, top.y + h * .32);
  ctx.lineTo(foot.x + w * .85, top.y + h * .69);
  ctx.lineTo(foot.x + w * .56, top.y + h * .66);
  ctx.lineTo(foot.x + w, top.y + h * .85);
  ctx.lineTo(foot.x - w, top.y + h * .85);
  ctx.lineTo(foot.x - w * .56, top.y + h * .66);
  ctx.lineTo(foot.x - w * .85, top.y + h * .69);
  ctx.lineTo(foot.x - w * .38, top.y + h * .32);
  ctx.lineTo(foot.x - w * .56, top.y + h * .34);
  ctx.closePath(); ctx.fill();

const COND_FIELDS = { tempF: '#cTemp', altitudeFt: '#cAlt', humidity: '#cHum', windMph: '#cWind', windFrom: '#cFrom', surface: '#cTurf' };
let cond = { ...COND_DEFAULT };
try { cond = { ...cond, ...JSON.parse(localStorage.getItem('teebox.conditions') || '{}') }; } catch (e) { /* storage unavailable */ }
if (!P.SURFACES[cond.surface]) cond.surface = COND_DEFAULT.surface;
for (const [k, v] of Object.entries(P.SURFACES)) $('#cTurf').add(new Option(v.label, k));
function conditions() { return cond; }
function showConditions() {
  const air = P.atmosphere(cond);
  $('#condSum').textContent = `· ${fmt(cond.tempF)}°F · ${fmt(cond.altitudeFt)} ft${cond.windMph ? ` · wind ${fmt(cond.windMph)} mph` : ''} · air ${air.rho.toFixed(3)} kg/m³`;
}
for (const [k, sel] of Object.entries(COND_FIELDS)) {
  const el = $(sel); el.value = cond[k];
  el.onchange = () => {
    if (k === 'surface') cond[k] = el.value;
    else { const n = parseFloat(el.value); cond[k] = Number.isFinite(n) ? Math.min(+el.max || n, Math.max(+el.min || 0, n)) : COND_DEFAULT[k]; el.value = cond[k]; }
    try { localStorage.setItem('teebox.conditions', JSON.stringify(cond)); } catch (e) { /* storage unavailable */ }
    showConditions();
  };
}
showConditions();

// ---------- UI wiring ----------
for (const c of Object.keys(P.CLUBS)) $('#club').add(new Option(c, c, false, c === '7i'));
$('#speed').onchange = (e) => (playSpeed = parseFloat(e.target.value));
const simulate = () => { const s = P.randomShot($('#club').value); s.source = 'sim'; handleShot(s); };
$('#simBtn').onclick = simulate;
addEventListener('keydown', (e) => { if (e.code === 'Space' && !/SELECT|BUTTON|INPUT|SUMMARY/.test(document.activeElement.tagName)) { e.preventDefault(); simulate(); } });
$('#clearBtn').onclick = () => { history.length = 0; clearSceneShots(); renderHistory(); drawMini(); $('#dataGrid').innerHTML = ''; $('#result').classList.remove('show'); };
$('#csvBtn').onclick = () => {
  const head = 'shot,club,source,ball_mph,vla,hla,backspin,sidespin,carry_yd,total_yd,offline_yd,apex_ft\n';
  const csv = head + history.map((h) => [h.n, h.club, h.src, h.speed, h.vla, h.hla, h.backspin, h.sidespin, h.carry, h.total, h.off, h.apexFt].map((v) => typeof v === 'number' ? +v.toFixed(2) : v).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'range-session.csv'; a.click();
};
drawMini(); renderHistory();

// ---------- server connection ----------
function setLm(st) {
  const dot = $('#lmDot'), txt = $('#lmTxt');
  if (!st.connected) { dot.className = 'dot'; txt.textContent = 'Launch monitor: not connected'; }
  else if (st.ready) { dot.className = 'dot ok'; txt.textContent = `${st.device || 'Launch monitor'}: ready`; }
  else { dot.className = 'dot wait'; txt.textContent = `${st.device || 'Launch monitor'}: connected, not ready`; }
}
if (location.protocol.startsWith('http')) {
  const es = new EventSource('/events');
  es.onopen = () => { $('#srvDot').className = 'dot ok'; };
  es.onerror = () => { $('#srvDot').className = 'dot'; $('#srvTxt').textContent = 'App server offline (simulation only)'; };
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'status') { if (m.port) $('#srvTxt').textContent = `Listening on port ${m.port}`; setLm(m); }
    else if (m.type === 'shot') { m.shot.source = 'launch-monitor'; handleShot(m.shot); }
  };
} else { $('#srvTxt').textContent = 'Opened as a file – run start.bat for launch monitor input'; }
</script>
</body>
